name: Shiplog agent jobs

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: shiplog-agent-jobs
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process durable journal jobs
        env:
          AGENT_URL: ${{ vars.SHIPLOG_AGENT_URL }}
          CRON_SECRET: ${{ secrets.SHIPLOG_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          [[ "$AGENT_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          curl --silent --show-error --fail-with-body \
            --max-time 290 --retry 2 --retry-delay 5 --retry-max-time 310 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$AGENT_URL/api/jobs"
